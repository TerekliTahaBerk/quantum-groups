name: docs

# Builds the documentation site (mkdocs.yml) on every push and pull request,
# and publishes it to GitHub Pages from main. One-time setup: Settings ->
# Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      - name: Build the site (warnings are errors)
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
