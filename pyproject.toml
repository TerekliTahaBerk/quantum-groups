[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-group"
version = "1.1.2"
description = "Exact SymPy verification of explicit U_q(sl_2) and GL_q(2|1) matrix identities"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Taha Berk Terekli", email = "terekli@tahaberk.com"},
]
keywords = ["quantum groups", "Hopf algebras", "R-matrix", "Yang-Baxter equation", "sympy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
# Lower bounds are the oldest versions exercised by the "minimum
# dependencies" CI job (Python 3.10, with numpy<2 for Matplotlib 3.5).
dependencies = [
    "sympy>=1.10",
    "networkx>=2.6",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
test = ["pytest"]
notebooks = ["jupyter"]
# Lint, type checking and coverage, as run by the `lint` and `coverage` CI jobs.
dev = ["pytest", "pytest-cov", "ruff", "mypy"]
# The documentation site (mkdocs.yml), as built by the `docs` workflow.
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[project.urls]
Homepage = "https://github.com/TerekliTahaBerk/quantum-groups"
Repository = "https://github.com/TerekliTahaBerk/quantum-groups"
Documentation = "https://tereklitahaberk.github.io/quantum-groups/"
Paper = "https://arxiv.org/abs/2610.07867"
DOI = "https://doi.org/10.48550/arXiv.2610.07867"
Issues = "https://github.com/TerekliTahaBerk/quantum-groups/issues"
Changelog = "https://github.com/TerekliTahaBerk/quantum-groups/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["quantum_group"]

# `python -m pytest` is the canonical validation command: it runs the test
# suite and the package doctests, exactly as CI does.
[tool.pytest.ini_options]
testpaths = ["tests", "quantum_group"]
addopts = "--doctest-modules"

[tool.ruff]
target-version = "py310"
line-length = 100
# examples/ and the manuscript folders are quoted verbatim in the README and the
# userguide, so they are kept byte-for-byte as published.
extend-exclude = ["examples", "thesis", "scipost", "arxiv", "notebooks"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors, import sorting, bugbear, pyupgrade.
select = ["F", "E4", "E7", "E9", "W", "I", "B", "UP"]
# Single-letter names such as `l` and `I` follow the mathematical notation.
ignore = ["E741"]

[tool.mypy]
python_version = "3.10"
files = ["quantum_group"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

# SymPy and NetworkX ship without type information.
[[tool.mypy.overrides]]
module = ["sympy", "sympy.*", "networkx", "networkx.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["quantum_group"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
